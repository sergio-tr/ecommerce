name: commercecore-mongo-t01

# Names only. The image, replica set, hostname, auth, and mounts stay in
# compose.yaml. The Docker volume name is not commercecore-mongo-data.
services:
  mongo:
    container_name: commercecore-mongo-t01

volumes:
  commercecore-mongo-data:
    name: commercecore-mongo-t01-data

networks:
  private:
    name: commercecore-mongo-t01
    internal: false
