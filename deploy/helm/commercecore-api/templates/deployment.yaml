apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "commercecore-api.fullname" . }}
  labels:
    {{- include "commercecore-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "commercecore-api.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "commercecore-api.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "commercecore-api.fullname" . }}
      automountServiceAccountToken: false
      hostNetwork: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: COMMERCECORE_ENV
              value: {{ .Values.env.commerceCoreEnv | quote }}
            - name: COMMERCECORE_HTTP_HOST
              value: "0.0.0.0"
            - name: COMMERCECORE_HTTP_PORT
              value: {{ .Values.env.port | quote }}
            - name: COMMERCECORE_LOG_LEVEL
              value: {{ .Values.env.logLevel | quote }}
            - name: COMMERCECORE_SERVICE_VERSION
              value: {{ .Values.env.serviceVersion | quote }}
            - name: HOME
              value: /tmp
            - name: TMPDIR
              value: /tmp
          readinessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
