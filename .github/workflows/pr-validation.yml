name: pr-validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Keep pull_request and push in separate groups. A push event has no pull
# request number; keying only on that number would collapse main pushes together.
concurrency:
  group: pr-validation-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve Nx format range
        id: format-range
        shell: bash
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: bash tools/ci/resolve-nx-format-range.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.10.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: pnpm

      - name: Show toolchain
        env:
          NX_FORMAT_BASE: ${{ steps.format-range.outputs.base }}
          NX_FORMAT_HEAD: ${{ steps.format-range.outputs.head }}
        run: |
          echo "commit=$(git rev-parse HEAD)"
          echo "nx-format-base=${NX_FORMAT_BASE}"
          echo "nx-format-head=${NX_FORMAT_HEAD}"
          node --version
          pnpm --version

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Quality targets
        env:
          NX_DAEMON: 'false'
          NX_NO_CLOUD: 'true'
          NX_FORMAT_BASE: ${{ steps.format-range.outputs.base }}
          NX_FORMAT_HEAD: ${{ steps.format-range.outputs.head }}
        run: |
          set -euo pipefail
          if [[ ! "${NX_FORMAT_BASE}" =~ ^[0-9a-f]{40}$ || ! "${NX_FORMAT_HEAD}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "refusing nx format:check without an explicit 40-character base and head" >&2
            exit 1
          fi
          pnpm exec nx --version
          pnpm exec nx run-many -t lint typecheck test build secret-scan --parallel=3 --output-style=static
          pnpm exec nx format:check --base="${NX_FORMAT_BASE}" --head="${NX_FORMAT_HEAD}"
          pnpm exec nx run commercecore-catalog-domain:architecture --output-style=static
          pnpm exec nx run commercecore-identity-domain:architecture --output-style=static
          mkdir -p tmp
          pnpm exec nx graph --file=tmp/nx-graph.json
          node tools/architecture/assert-project-graph.mjs tmp/nx-graph.json

      - name: Local representative demo
        env:
          NX_DAEMON: 'false'
          NX_NO_CLOUD: 'true'
        run: pnpm run local-representative-demo

      - name: Local egame fullstack smoke
        env:
          NX_DAEMON: 'false'
          NX_NO_CLOUD: 'true'
        run: pnpm run local-egame-fullstack-smoke

      - name: Local commercecloud shell smoke
        env:
          NX_DAEMON: 'false'
          NX_NO_CLOUD: 'true'
        run: pnpm run local-commercecloud-shell-smoke

      - name: Local commercecore stack smoke
        env:
          NX_DAEMON: 'false'
          NX_NO_CLOUD: 'true'
        run: pnpm run local-commercecore-stack-smoke

      - name: Local commercecore stack browser
        env:
          NX_DAEMON: 'false'
          NX_NO_CLOUD: 'true'
        run: pnpm run local-commercecore-stack-browser

  chart:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm 4.3.1
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/helm.tgz https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz
          echo "0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b  /tmp/helm.tgz" | sha256sum -c -
          tar -C /tmp -xzf /tmp/helm.tgz linux-amd64/helm
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version --short

      - name: Lint and render the local chart
        run: |
          set -euo pipefail
          helm lint deploy/helm/commercecore-api
          helm lint deploy/helm/commercecore-api --values deploy/helm/commercecore-api/values-two-replica.yaml
          node --test tools/k8s/assert-local-contract.spec.mjs tools/k8s/k3d-two-replica-smoke.spec.mjs

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the API image without pushing
        run: docker build -t commercecore-api:ci .

      - name: Probe /health/live on loopback
        run: |
          set -euo pipefail
          docker run -d --name commercecore-api-ci \
            --read-only \
            --tmpfs /tmp \
            -p 127.0.0.1:3000:3000 \
            -e COMMERCECORE_ENV=local \
            -e COMMERCECORE_HTTP_HOST=0.0.0.0 \
            -e COMMERCECORE_HTTP_PORT=3000 \
            -e COMMERCECORE_SERVICE_VERSION=0.0.0 \
            -e COMMERCECORE_LOG_LEVEL=info \
            commercecore-api:ci
          trap 'docker rm -f commercecore-api-ci >/dev/null' EXIT
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/health/live; then
              echo
              exit 0
            fi
            sleep 1
          done
          docker logs commercecore-api-ci >&2
          exit 1
